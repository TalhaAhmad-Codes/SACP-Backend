services:

  postgres:
    image: postgres:16
    container_name: sacp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sacp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ta82542
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: sacp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: